<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据资产管理平台</title>
    <script type="text/javascript">
      // SPA 路由恢复脚本 - 用于 GitHub Pages
      // 处理从 404.html 重定向回来的情况
      // 格式: /?/path/to/page&query -> /path/to/page?query
      (function(l) {
        if (l.search && l.search.startsWith('?/')) {
          var decoded = l.search.slice(1).replace(/~and~/g, '&');
          var queryIndex = decoded.indexOf('&');
          var path = queryIndex > -1 ? decoded.slice(0, queryIndex) : decoded;
          var query = queryIndex > -1 ? '?' + decoded.slice(queryIndex + 1) : '';
          
          window.history.replaceState(null, null,
            l.pathname + path + query + l.hash
          );
        }
      }(window.location))
    </script>
    
    <!-- 禁用缓存（用于 GitHub Pages 部署后强制刷新） -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
